services:
  - type: web
    name: taxflow-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:api
    startCommand: npx prisma db push --skip-generate && npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: APP_URL
        value: https://tax-flow-web.vercel.app
